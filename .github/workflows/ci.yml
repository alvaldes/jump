name: CI

# Push only: the repository is private (no fork pull requests), and running on
# both push and pull_request would build every PR branch twice.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Runner images ship one major Xcode; pick the newest stable one installed
      # (never a beta or release candidate) instead of pinning a path that
      # disappears with image updates.
      - name: Select newest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test JumpKit
        run: swift test --package-path Packages/JumpKit

      - name: Build jump-bench
        run: swift build -c release --package-path Packages/JumpKit --product jump-bench

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # Unsigned: CI has no Apple certificate. Local builds sign through
      # Config/Signing.local.xcconfig.
      - name: Build app (Release)
        run: |
          xcodegen generate
          xcodebuild -project JUMP.xcodeproj -scheme JUMP -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
