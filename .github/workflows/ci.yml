name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Runner images ship one major Xcode; pick the newest one installed
      # instead of pinning a path that disappears with image updates.
      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test JumpKit
        run: swift test --package-path Packages/JumpKit

      - name: Build jump-bench
        run: swift build -c release --package-path Packages/JumpKit --product jump-bench

      - name: Install XcodeGen
        run: brew install xcodegen

      # Unsigned: CI has no Apple certificate. Local builds sign through
      # Config/Signing.local.xcconfig.
      - name: Build app (Release)
        run: |
          xcodegen generate
          xcodebuild -project JUMP.xcodeproj -scheme JUMP -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
