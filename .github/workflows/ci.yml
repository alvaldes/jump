name: CI

# Push only: the repository is private (no fork pull requests), and running on
# both push and pull_request would build every PR branch twice.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Runner images ship one major Xcode; pick the newest stable one installed
      # (never a beta or release candidate) instead of pinning a path that
      # disappears with image updates.
      - name: Select newest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
          echo "TOOLCHAIN=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_ENV"

      # Build products are keyed on the toolchain and every source input; a
      # miss restores the newest cache for the same toolchain and builds
      # incrementally from it.
      - name: Cache build products
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            Packages/JumpKit/.build
            build
          key: build-${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Packages/JumpKit/**/*.swift', 'JUMP/**', 'project.yml', 'Config/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ env.TOOLCHAIN }}-

      - name: Test JumpKit
        run: swift test --package-path Packages/JumpKit

      - name: Build jump-bench
        run: swift build -c release --package-path Packages/JumpKit --product jump-bench

      # Pinned release with a verified checksum instead of whatever Homebrew
      # currently ships.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      # Unsigned: CI has no Apple certificate. Local builds sign through
      # Config/Signing.local.xcconfig.
      - name: Build app (Release)
        run: |
          xcodegen generate
          xcodebuild -project JUMP.xcodeproj -scheme JUMP -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
